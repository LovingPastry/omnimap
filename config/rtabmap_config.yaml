Training:
  init_itr_num: 1000
  init_gaussian_update: 100
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_extent: 30
  gaussian_extent: 1.0
  gaussian_update_every: 201
  gaussian_reset: 301
  gaussian_th: 0.7
  size_threshold: 20
  rgb_boundary_threshold: 0.01
  max_keyframe_skip: 20
  window_size: 19
  frame_itr: 1
  alpha: 0.9
  use_ssim: true
  ssim_weight: 0.25
  use_omni_normal: false
  normal_weight: 0.05
  compensate_exposure: false
  deblur: false


opt_params:
  pose_lr: 0.0001
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.001
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densify_grad_threshold: 0.0002
  exposure_lr: 0.02
  post_refine: true
  post_itr: 500
  deblur_trans: 0.001
  deblur_weight: 0.01


tsdf:
  voxel_size: 0.006
  block_resolution: 8
  block_count: 30000
  unregistered_threshold: 0.005
  use_spatial_bounds: true
  spatial_bounds: [-1.0, -0.1, -0.4, 0.4, -0.2, 0.3]  
  # spatial_bounds: [-5.0, 5.0, -5.0, 5.0, -5.0, 5.0]  
  reference_radius_default_m: 0.35
  reference_radius_use_adaptive: true
  reference_radius_diag_scale: 0.20
  reference_radius_min_m: 0.30
  reference_radius_max_m: 0.40
  reference_center_mode: dynamic  # fixed表示中心不会移动,dynamic表示动态移动 
  reference_center_ema_alpha: 0.10
  
instance:
  instance_skip: 1
  pro_thre: 0.40
  ins_min_count: 3
  vox_min_count: 3
  ins_min_voxel: 15
  fill_dis: 0.05

path:
  data_path: /home/fuyx/lanzc/omnimap/replica/input
  yolo_config: /home/fuyx/lanzc/omnimap/thirdparty/YOLO-World/configs/pretrain/yolo_world_v2_l_clip_large_vlpan_bn_2e-3_100e_4x8gpus_obj365v1_goldg_train_800ft_lvis_minival.py
  yolo_cp: /home/fuyx/lanzc/omnimap/thirdparty/YOLO-World/weights/yolo_world_v2_l_clip_large_o365v1_goldg_pretrain_800ft-9df82e55.pth
  tap_cp1: /home/fuyx/lanzc/omnimap/thirdparty/TAP/weights/tap_vit_l_v1_0.pkl
  tap_cp2: /home/fuyx/lanzc/omnimap/thirdparty/TAP/weights/merged_2560.pkl
  sbert_cp: /home/fuyx/lanzc/omnimap/thirdparty/all-MiniLM-L6-v2

fisher_local_velocity_only: false

# ── 速度规划 / 运动控制 ──────────────────────────────────────────
motion_control:
  # 共享参数（Planning + Servo 共用）
  linear_vel_max: 0.05              # 最大线速度 (m/s)
  linear_deadband: 0.001            # Servo 线速度死区 (m/s)，低于该速度直接置零
  angular_speed_max: -0.05          # 最大角速度 (rad/s)
  enable_angular: true              # 是否启用角运动
  radial_gain: 2.0                  # Servo 径向半径误差增益 (1/s)
  radial_i_gain: 0.01               # Servo 径向半径误差积分增益 (1/s^2)，0 表示退化为纯 P
  radial_deadband: 0.001            # Servo 径向半径误差死区 (m)
  radial_integral_limit: 0.05       # Servo 径向积分状态限幅 (m*s)
  radial_vel_max: 0.015             # Servo 径向速度单独限幅 (m/s)
  angular_gain: 2.0                 # Servo 姿态误差增益 (1/s)
  angular_deadband: 0.001           # Servo 姿态旋转向量误差死区 (rad)
  linear_accel_max: 0.1             # Servo 线速度斜率限幅 (m/s^2)
  angular_accel_max: 1.0            # Servo 角速度斜率限幅 (rad/s^2)

  # Planning 节点专用
  planner_hz: 30.0                  # 规划循环频率 (Hz)
  pose_stale_timeout_sec: 0.2       # 位姿过期阈值 (s)
  fisher_step_scale: 1              # Fisher 信息步长缩放
  dt: 0.02                          # 运动策略时间步长，当前分支没用
  grad_eps: 0.01                    # 梯度数值微分 epsilon
  spherical_speed_min: 0.0          # 最小球面速度

  # Servo 节点专用
  servo_hz: 50.0                    # Servo 循环频率 (Hz)
  spherical_cmd_timeout_sec: 1.25   # 命令超时阈值 (s)

# ── 主动视角策略：可切换修复（消融 / 回退开关）────────────────────────
# 本配置启用目标语义筛选；代码默认仍全部关闭，整节缺省或全部关闭时回退原版。
# 实现见 omnimap/gaussian/renderer/nbv/policy_improvements.py，消融见 docs/nbv_ablation.md。
nbv_policy:
  # angle = 原版 (theta,phi) 探测+控制；tangent = 大圆等弧长探测 + 单位切基（消除极点 cos²φ 退化）
  gradient_space: angle
  # 修复1 可达性：仰角带/工作空间盒外的速度分量做切锥投影，阻止"冲向半球边缘/桌下"
  feasibility:
    enabled: false
    phi_min_deg: 15.0
    phi_max_deg: 80.0
    margin_deg: 8.0
    workspace_bounds: null      # 相机位置可达盒 [x_min,x_max,y_min,y_max,z_min,z_max]（世界系）
    workspace_margin_m: 0.03
    hard_clamp: true
  # 目标语义掩码：Tracking 把高斯关联到 TSDF 实例，用实例 SBERT embedding 与 cup 比较。
  # semantic 模式按逐高斯归属筛选，不使用 ROI 包围盒；未匹配/未知高斯权重为 0，暂时等待观测。
  # 关闭 enabled 可回退原版；sbert / yolo_live 仍保留为包围盒对照模式。
  fisher_mask:
    enabled: true
    roi_query: cup
    roi_query_mode: semantic
    roi_query_min_similarity: 0.35  # 对融合后的实例 embedding 重新归一化，再计算余弦相似度
    semantic_max_distance_m: null  # null = instance.fill_dis，高斯中心离语义体素过远则归为未知
    roi_bounds: tsdf              # 仅 sbert / yolo_live 包围盒模式使用
    roi_padding_m: 0.0
    support_plane_z: null         # 可另填桌面高度；不自动检测桌面
    plane_softness_m: 0.01
    roi_query_score_thresh: 0.05   # 仅 yolo_live 使用
    roi_query_refresh_every: 30   # 仅包围盒模式缓存；semantic 每个 Tracking 帧重新关联高斯
  # 修复3 速度尺度：normalized = 梯度只给方向，速率 = v_nominal·|g|/(|g|+κ)，κ=|g| 滑动中位数
  velocity_mapping:
    mode: legacy                # legacy | normalized
    v_nominal_mps: 0.03
    kappa_window: 20
  # 修复4 停止判据（取或）：信息饱和 / 视角球覆盖 / 预算 / 停滞
  stop:
    enabled: false
    min_steps: 600
    saturation_enabled: true
    score_window: 300            # 规划 30 Hz，窗口按 tick 计
    score_ratio: 0.10
    global_probe_views: 12       # 局部饱和只是提名：再给未覆盖的可达方向打分，全局也饱和才停
    global_check_every: 150       # 30 Hz 规划下约 5 s 一次；每次要多渲染 global_probe_views 个视角
    confirm_checks: 2            # 连续确认次数，防止建图侧 opacity reset 造成的瞬时全局塌缩误触发
    coverage_enabled: true
    coverage_threshold: 0.90
    coverage_radius_deg: 25.0
    coverage_phi_min_deg: 15.0
    coverage_phi_max_deg: 80.0
    max_steps: null
    max_path_m: null
    max_time_s: null
    wall_clock: true            # 真机：预算按墙钟计（规划 dt 只是名义值）
    stall_enabled: false
    stall_speed_mps: 0.001
    stall_steps: 15
